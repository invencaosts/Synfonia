services:
  postgres:
    image: postgres:16-alpine
    container_name: synfonia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-db_usuarios_musicas}
      POSTGRES_USER: ${DB_USER:-musicas_user}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_INITDB_ARGS: "-c client_encoding=UTF8 -c timezone=America/Sao_Paulo"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - synfonia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  ytmusic:
    build:
      context: ./YtMusicService
      dockerfile: Dockerfile
    container_name: synfonia_ytmusic
    restart: unless-stopped
    ports:
      - "127.0.0.1:${YTMUSIC_PORT:-8001}:8001"
    networks:
      - synfonia_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synfonia_backend
    profiles: ["prod"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      YTMUSIC_SERVICE_URL: http://ytmusic:8001
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ytmusic:
        condition: service_healthy
    networks:
      - synfonia_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v3/api-docs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  sonar-postgres:
    image: postgres:16-alpine
    container_name: synfonia_sonar_postgres
    profiles: ["quality"]
    environment:
      POSTGRES_DB: ${SONAR_DB_NAME:-sonarqube}
      POSTGRES_USER: ${SONAR_DB_USER:-sonar_user}
      POSTGRES_PASSWORD: ${SONAR_DB_PASS:-sonar_local_change_me}
    volumes:
      - sonar_postgres_data:/var/lib/postgresql/data
    networks:
      - synfonia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:lts-alpine
    container_name: synfonia_sonarqube
    profiles: ["quality"]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-postgres:5432/${SONAR_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar_user}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASS:-sonar_local_change_me}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLED: "true"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      sonar-postgres:
        condition: service_healthy
    networks:
      - synfonia_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-proxy -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  sonar_postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  synfonia_network:
    driver: bridge
