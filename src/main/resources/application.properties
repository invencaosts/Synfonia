spring.application.name=musicas

# Carrega as variaveis locais sem exigir "source .env". A importacao e opcional
# para permitir que ambientes implantados continuem usando variaveis do sistema.
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_usuarios_musicas}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:musicas_user}
spring.datasource.password=${DB_PASS}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# MongoDB Configuration
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DB:musicas}
spring.data.mongodb.username=${MONGO_USER:mongo_user}
spring.data.mongodb.password=${MONGO_PASSWORD}
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.auto-index-creation=false

# Security Configuration
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin@123}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION}
jwt.refreshExpiration.ms=${JWT_REFRESH_EXPIRATION}

# Logging Configuration
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
logging.level.org.springframework.orm.jpa.JpaTransactionManager=INFO
logging.level.org.springframework.data.jpa=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Fuso Horario Brasileiro
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.date-format=dd/MM/yyyy HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# Spotify API Configuration
spotify.client.id=${SPOTIFY_CLIENT_ID:dummy_id}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET:dummy_secret}
spotify.redirect.uri=${SPOTIFY_REDIRECT_URI:http://localhost:8080/api/v1/spotify/callback}

# YT Music microservice (Python/ytmusicapi)
ytmusic.service.url=${YTMUSIC_SERVICE_URL:http://localhost:8001}

server.address=0.0.0.0
server.port=${PORT:8080}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Java Mail Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USER:user}
spring.mail.password=${MAIL_PASS:pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.mime.charset=UTF-8

# Application Configuration
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
server.forward-headers-strategy=native
